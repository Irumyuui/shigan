name: CI

on:
  # Tags are handled by release.yml; CI runs for branches only.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JUST_VERSION: 1.58.0
  JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  /tmp/just.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
          just --version
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck + unit tests
        run: just typecheck test-unit
      - name: Cache VS Code test build
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs', 'package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-
      - name: Integration tests
        run: xvfb-run --auto-servernum just test-integration

  package:
    name: Package VSIX
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  /tmp/just.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
          just --version
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Package
        run: just package
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: shigan-vsix
          path: artifacts/*.vsix
          retention-days: 14
